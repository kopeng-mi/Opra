<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opra Shipkit — Three.js Model Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0e14;
      color: #d1d8e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .overlay {
      position: absolute;
      pointer-events: none;
      z-index: 10;
    }
    .panel {
      pointer-events: auto;
      background: rgba(16, 23, 32, 0.88);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(80, 110, 140, 0.35);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    #top-left {
      top: 20px;
      left: 20px;
      max-width: 380px;
    }
    h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #58a6ff;
      margin-bottom: 4px;
    }
    h2 {
      font-size: 14px;
      font-weight: 600;
      color: #f0f6fc;
      margin-bottom: 8px;
    }
    p {
      font-size: 12px;
      line-height: 1.5;
      color: #8b949e;
      margin-bottom: 14px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .stat-key { color: #8b949e; }
    .stat-val { font-weight: 600; color: #7ee787; }
    #top-right {
      top: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .section-label {
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #8b949e;
      margin-bottom: 2px;
    }
    button {
      background: rgba(30, 42, 56, 0.8);
      color: #c9d1d9;
      border: 1px solid rgba(80, 110, 140, 0.4);
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }
    button:hover {
      background: rgba(45, 65, 88, 0.9);
      border-color: #58a6ff;
      color: #fff;
    }
    button.active {
      background: #1f6feb;
      border-color: #58a6ff;
      color: #fff;
      font-weight: 600;
    }
    #bottom-bar {
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
    }
    #bottom-bar button {
      text-align: center;
      padding: 6px 16px;
      font-size: 11px;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      background: #238636;
      color: #fff;
      margin-left: 6px;
    }
  </style>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>

  <div id="top-left" class="overlay panel">
    <h1>Opra Plan 07 — Shipkit</h1>
    <h2 id="model-title">Loading...</h2>
    <p id="model-desc">Loading description...</p>
    <div class="section-label">Authoring & Gate Metrics</div>
    <div id="model-stats"></div>
  </div>

  <div id="top-right" class="overlay panel">
    <div class="section-label">Select Model</div>
    <div id="model-selector" class="btn-group"></div>
  </div>

  <div id="bottom-bar" class="overlay panel">
    <button class="view-btn" data-view="iso">Perspective (Iso)</button>
    <button class="view-btn" data-view="plan">Plan View (Top)</button>
    <button class="view-btn" data-view="side">Side View</button>
    <button class="view-btn" data-view="aft">Aft (Drive)</button>
  </div>

  <script type="module" src="./viewer_bundle.js"></script>
</body>
</html>
